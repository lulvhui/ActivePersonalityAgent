[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "active-personality-agent"
version = "0.1.0"
description = "V3 active multimodal perception, evidence memory and TECA training"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
jev = ["typesafe-sdk==0.7.5"]
model = ["torch>=2.6", "torchvision>=0.21", "transformers==4.57.1", "accelerate>=1.6", "qwen-omni-utils>=0.0.9", "av>=14.2,<15", "peft>=0.15", "soundfile", "numpy", "Pillow", "lm-format-enforcer==0.11.3"]

[project.scripts]
amp = "amp.cli:main"

[tool.setuptools.packages.find]
include = ["amp*"]
